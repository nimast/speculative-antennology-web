<!doctype html>
<html><head><meta charset="utf-8"/>
<style>html,body{margin:0;background:#fff}#c{width:600px;height:600px}canvas{display:block;background:#fff}</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="c"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const SIZE = 600;
const params = new URLSearchParams(location.search);
const modelUrl = params.get('model');

const mount = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.setClearColor(0xffffff, 1);
mount.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 0.85);
key.position.set(2,3,2); scene.add(key);
const root = new THREE.Group(); scene.add(root);

const inkMat = new THREE.ShaderMaterial({
  uniforms:{ uEdge:{value:0.35} },
  vertexShader:`varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vN;varying vec3 vV;uniform float uEdge;void main(){float n=dot(normalize(vN),normalize(vV));float rim=smoothstep(uEdge,uEdge+0.05,n);float shade=step(0.55,n);vec3 col=mix(vec3(0.0),vec3(0.82),rim);col=mix(col,vec3(0.35),(1.0-shade)*rim);gl_FragColor=vec4(col,1.0);}`,
  side: THREE.DoubleSide
});

const rot = { x:0.25, y:0.0 };
const dist = 3.8;
const target = new THREE.Vector3();
function renderAt(theta){
  rot.y = theta;
  const cx = Math.sin(rot.y)*Math.cos(rot.x)*dist;
  const cy = Math.sin(rot.x)*dist;
  const cz = Math.cos(rot.y)*Math.cos(rot.x)*dist;
  camera.position.set(cx,cy,cz);
  camera.lookAt(target);
  renderer.render(scene,camera);
}
camera.aspect = 1; camera.updateProjectionMatrix();

window.__ready = false;
const loader = new GLTFLoader();
loader.load(modelUrl, (gltf)=>{
  const obj = gltf.scene;
  obj.traverse(o=>{ if(o.isMesh) o.material = inkMat; });
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const group = new THREE.Group();
  obj.position.set(-sphere.center.x,-sphere.center.y,-sphere.center.z);
  group.add(obj);
  group.scale.setScalar(1.0/Math.max(0.0001, sphere.radius));
  root.add(group);
  renderAt(0);
  window.__ready = true;
}, undefined, (err)=>{ window.__error = String(err); });

window.__frame = (theta)=>{ renderAt(theta); return renderer.domElement.toDataURL('image/png'); };
</script>
</body></html>
