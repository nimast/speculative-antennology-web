name: notion-sync

on:
  schedule:
    # Daily at 06:00 UTC (≈ early morning CET / late evening US west)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node tools/sync-from-notion.mjs

      - name: Run structural checks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node tools/check.mjs

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/islands.generated.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git --no-pager diff --stat -- data/islands.generated.js
          fi

      - name: Open PR with the changes
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: notion-sync/auto
          base: main
          commit-message: "chore(notion): sync islands from Notion"
          title: "chore(notion): sync islands from Notion"
          body: |
            Automated sync from the **Exposition Text Fragments** Notion DB.

            `data/islands.generated.js` was regenerated by
            `tools/sync-from-notion.mjs` and differs from `main`. Review the
            diff before merging — every change here originated as a Notion
            edit (new fragment, edited body, repositioned, threads added).

            Triggered by: `${{ github.event_name }}`
          labels: |
            notion-sync
            automated
          delete-branch: true
